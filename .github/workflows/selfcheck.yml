name: selfcheck

# Validates the benchmark itself, both suites. Every task's reference solution
# must pass its own tests; the harness unit tests must pass; and the tool-loop
# scorer must score its scripted agents correctly -- in particular it must still
# reject the agent that records a verified answer to the wrong question, which is
# the one failure the harness cannot catch by re-running evidence.
#
# Needs no model, no GPU and no dependencies, so it runs in seconds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and current: the harness is stdlib-only, and staying
        # compatible with a distro Python is part of the point.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: List both suites
        run: python3 -m bench tasks

      - name: Validate tasks, harness and tool-loop scorer
        run: python3 -m bench selfcheck

      - name: Regenerate report from committed results
        run: python3 -m bench report
