name: selfcheck

# Validates the benchmark itself. Every task's reference overlay must make its
# hidden tests pass while the project as shipped fails them; the workspace must
# keep those tests unreadable; and the scorer must still reject the scripted
# agent that announces success without changing anything -- the failure that
# costs most in real use and the one nothing else here can catch.
#
# Needs no model, no GPU and no dependencies. The performance tasks execute real
# workloads, so it takes well under a minute rather than seconds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and current: the harness is stdlib-only, and staying
        # compatible with a distro Python is part of the point.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: List the tasks
        run: python3 -m bench tasks

      - name: Validate tasks, workspace and scorer
        run: python3 -m bench selfcheck

      - name: Regenerate report from committed results
        run: python3 -m bench report
